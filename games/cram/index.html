<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cram</title>
  <link rel="stylesheet" href="../../navbar.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- navbar injected by navbar.js -->

  <main>

    <!-- ── Settings screen ───────────────────────────────────────── -->
    <section id="settings-screen">
      <h1 class="game-title">Cram</h1>
      <div class="card">
        <div class="card-header">
          <h2>Settings</h2>
          <button id="close-settings-btn" class="btn-close" hidden>&times;</button>
        </div>

        <div class="field">
          <label class="field-label">Variant</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="variant" value="even-even" checked>
              Even-by-Even Cram
            </label>
            <label class="radio-label">
              <input type="radio" name="variant" value="odd-even">
              Odd-by-Even Cram
            </label>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Rows</label>
          <div class="option-group" id="rows-options">
            <label class="option-box"><input type="radio" name="rows" value="4"><span>4</span></label>
            <label class="option-box"><input type="radio" name="rows" value="6" checked><span>6</span></label>
            <label class="option-box"><input type="radio" name="rows" value="8"><span>8</span></label>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Columns</label>
          <div class="option-group" id="cols-options">
            <label class="option-box"><input type="radio" name="cols" value="4">4</label>
            <label class="option-box"><input type="radio" name="cols" value="6" checked>6</label>
            <label class="option-box"><input type="radio" name="cols" value="8">8</label>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Opponent</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="opponent" value="human" checked>
              Human
            </label>
            <label class="radio-label">
              <input type="radio" name="opponent" value="computer">
              Computer <span class="tag">Novice</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="opponent" value="expert">
              Computer <span class="tag">Expert</span>
            </label>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Who goes first?</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="first-player" value="player1" checked>
              Player 1
            </label>
            <label class="radio-label">
              <input type="radio" name="first-player" value="player2">
              <span id="p2-label">Player 2</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="first-player" value="random">
              Random
            </label>
          </div>
        </div>

        <button id="start-btn" class="btn-primary">Start Game</button>
      </div>
    </section>

    <!-- ── Game screen ────────────────────────────────────────────── -->
    <section id="game-screen" hidden>

      <div class="game-bar">
        <div id="turn-indicator" class="turn-indicator"></div>
        <div class="game-bar-actions">
          <button id="see-rules-btn" class="btn-ghost">See rules</button>
          <button id="back-btn" class="btn-ghost">Settings</button>
        </div>
      </div>

      <div id="grid-wrap" class="grid-wrap">
        <div id="cram-grid" class="cram-grid"></div>
      </div>

      <div id="prompt-section" class="moves-section" hidden>
        <p id="prompt-label" class="moves-label">Select first square</p>
      </div>

      <div id="thinking-indicator" class="thinking-indicator" hidden>
        Computer is thinking…
      </div>

      <div id="rules-panel" class="rules-panel">
        <div class="rules-box">
          <h2 id="rules-panel-title" class="rules-panel-title"></h2>
          <ul id="rules-list" class="rules-list"></ul>
          <button id="rules-play-btn" class="btn-primary">Let's play!</button>
        </div>
      </div>

      <div id="game-over-panel" class="game-over-panel">
        <div class="game-over-box">
          <div id="game-over-subtitle" class="game-over-subtitle">No valid moves remaining.</div>
          <div id="winner-text" class="winner-text"></div>
          <div class="game-over-actions">
            <button id="play-again-btn" class="btn-primary">Play Again</button>
            <button id="new-game-btn" class="btn-ghost">Change Settings</button>
          </div>
        </div>
      </div>

    </section>

  </main>

  <script src="../../navbar.js" data-root="../../" data-back-href="../index.html" data-back-label="Games"></script>
  <script src="game.js"></script>
</body>
</html>
