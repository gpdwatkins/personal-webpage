<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One-pile Nim</title>
  <link rel="stylesheet" href="../../navbar.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- navbar injected by navbar.js -->

  <main>

    <!-- ── Settings screen ───────────────────────────────────────── -->
    <section id="settings-screen">
      <h1 class="game-title">One-pile Nim</h1>
      <div class="card">
        <div class="card-header">
          <h2>Settings</h2>
          <button id="close-settings-btn" class="btn-close" hidden>&times;</button>
        </div>

        <div class="field">
          <label class="field-label">Starting counters: <span id="counter-display">21</span></label>
          <div class="slider-wrap">
            <input type="range" id="starting-counters" min="15" max="30" value="21" step="1">
            <div class="slider-labels">
              <span>15</span>
              <span>30</span>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Opponent</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="opponent" value="human" checked>
              Human
            </label>
            <label class="radio-label">
              <input type="radio" name="opponent" value="computer">
              Computer <span class="tag">Novice</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="opponent" value="expert">
              Computer <span class="tag">Expert</span>
            </label>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Who goes first?</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="first-player" value="player1" checked>
              Player 1
            </label>
            <label class="radio-label">
              <input type="radio" name="first-player" value="player2">
              <span id="p2-label">Player 2</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="first-player" value="random">
              Random
            </label>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Taking rules</label>
          <div class="radio-group vertical">
            <label class="radio-label">
              <input type="radio" name="rules" value="123" checked>
              1, 2 or 3 counters
            </label>
            <label class="radio-label">
              <input type="radio" name="rules" value="squares">
              Any square number &nbsp;<span class="hint">(1, 4, 9, 16, 25, …)</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="rules" value="primes1">
              Any prime, or 1 &nbsp;<span class="hint">(1, 2, 3, 5, 7, 11, …)</span>
            </label>
          </div>
        </div>

        <div class="field">
          <label class="checkbox-label">
            <input type="checkbox" id="misere">
            <span>Misère version</span>
          </label>
          <p class="explanation">
            In the standard game the player who takes the last counter <u>wins</u>.<br>
            In the misère version the player who takes the last counter <u>loses</u>.
          </p>
        </div>

        <button id="start-btn" class="btn-primary">Start Game</button>
      </div>
    </section>

    <!-- ── Game screen ────────────────────────────────────────────── -->
    <section id="game-screen" hidden>

      <div class="rules-display" id="rules-display">
        <span class="rules-label">Rules</span>
        <div class="rules-groups">
          <div class="rules-group">
            <span class="rule-pill" data-rule="123">1, 2, 3</span>
            <span class="rule-pill" data-rule="squares">Squares</span>
            <span class="rule-pill" data-rule="primes1">Primes ∪ {1}</span>
          </div>
          <div class="rules-group">
            <span class="rule-pill" data-rule="standard">Standard</span>
            <span class="rule-pill" data-rule="misere">Misère</span>
          </div>
        </div>
      </div>

      <div class="game-bar">
        <div id="turn-indicator" class="turn-indicator"></div>
        <div class="game-bar-actions">
          <button id="see-rules-btn" class="btn-ghost">See rules</button>
          <button id="back-btn" class="btn-ghost">Settings</button>
        </div>
      </div>

      <p id="pile-info" class="pile-info"></p>

      <div id="counter-area" class="counter-area"></div>

      <div id="moves-section" class="moves-section">
        <p class="moves-label">How many counters will you take?</p>
        <div id="move-buttons" class="move-buttons"></div>
      </div>

      <div id="thinking-indicator" class="thinking-indicator" hidden>
        Computer is thinking…
      </div>

      <div id="rules-panel" class="rules-panel">
        <div class="rules-box">
          <h2 id="rules-panel-title" class="rules-panel-title"></h2>
          <ul id="rules-list" class="rules-list"></ul>
          <button id="rules-play-btn" class="btn-primary">Let's play!</button>
        </div>
      </div>

      <div id="game-over-panel" class="game-over-panel">
        <div class="game-over-box">
          <div id="winner-text" class="winner-text"></div>
          <div class="game-over-actions">
            <button id="play-again-btn" class="btn-primary">Play Again</button>
            <button id="new-game-btn" class="btn-ghost">Change Settings</button>
          </div>
        </div>
      </div>

    </section>

  </main>

  <script src="../../navbar.js" data-root="../../" data-back-href="../index.html" data-back-label="Games"></script>
  <script src="game.js"></script>
</body>
</html>
