<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160">
  <defs>
    <radialGradient id="counterGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%"  stop-color="#e8a050"/>
      <stop offset="55%" stop-color="#c87828"/>
      <stop offset="100%" stop-color="#a0601c"/>
    </radialGradient>
  </defs>
  <rect width="260" height="160" fill="#162033"/>

  <!-- Pile A: 2 cols x 3 rows -->
  <circle cx="45"  cy="40"  r="16" fill="url(#counterGrad)"/>
  <circle cx="85"  cy="40"  r="16" fill="url(#counterGrad)"/>
  <circle cx="45"  cy="80"  r="16" fill="url(#counterGrad)"/>
  <circle cx="85"  cy="80"  r="16" fill="url(#counterGrad)"/>
  <circle cx="45"  cy="120" r="16" fill="url(#counterGrad)"/>
  <circle cx="85"  cy="120" r="16" fill="url(#counterGrad)"/>

  <!-- Divider between the two piles -->
  <rect x="123" y="20" width="4" height="120" rx="2" fill="#2a3f5a"/>

  <!-- Pile B: 3 cols x 3 rows -->
  <circle cx="165" cy="40"  r="16" fill="url(#counterGrad)"/>
  <circle cx="205" cy="40"  r="16" fill="url(#counterGrad)"/>
  <circle cx="165" cy="80"  r="16" fill="url(#counterGrad)"/>
  <circle cx="205" cy="80"  r="16" fill="url(#counterGrad)"/>
  <circle cx="165" cy="120" r="16" fill="url(#counterGrad)"/>
  <circle cx="205" cy="120" r="16" fill="url(#counterGrad)"/>
</svg>
